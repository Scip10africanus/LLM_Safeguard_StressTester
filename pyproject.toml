[project]
name = "redteam"
version = "0.1.0"
description = "Evaluation harness for automated LLM red-teaming research"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["redteam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
